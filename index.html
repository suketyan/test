<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>漢字練習 - ダブルタップ完全統一版</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <style>
    :root{
        --bg-page: #f0f0f0;
        --toolbar-bg: rgba(240,240,240,0.6);
        --toolbar-fore: #111;
        --button-bg: rgba(255,255,255,0.4);
        --button-fore: #333;
        --button-active-bg: rgba(0,120,212,0.5);
        --canvas-bg: #ffffff;
        --stroke: #333;
        --toolbar-shadow: rgba(0,0,0,0.1);
        --toolbar-border: rgba(255,255,255,0.35);
    }
    [data-theme="dark"]{
        --bg-page: #0f1113;
        --toolbar-bg: rgba(18,20,22,0.86);
        --toolbar-fore: #eef3ff;
        --button-bg: rgba(255,255,255,0.08);
        --button-fore: #e6eef8;
        --button-active-bg: rgba(10,130,230,0.25);
        --canvas-bg: #0b0c0e;
        --stroke: #e6eef8;
        --toolbar-shadow: rgba(0,0,0,0.7);
        --toolbar-border: rgba(255,255,255,0.06);
    }

    * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; box-sizing: border-box; }
    html,body { height:100%; margin:0; overflow: hidden; background: var(--bg-page); }
    body { font-family: system-ui, -apple-system, sans-serif; touch-action: none; -webkit-text-size-adjust: none; }
    canvas { background: var(--canvas-bg); cursor: crosshair; display:block; transition: background-color 0.25s ease; }

    .toolbar {
        padding: 12px; display: flex; gap: 16px; position: fixed; top: 20px; left: 20px; z-index: 200;
        border-radius: 18px; background: var(--toolbar-bg); align-items: center;
        backdrop-filter: blur(10px) saturate(120%); -webkit-backdrop-filter: blur(10px) saturate(120%);
        box-shadow: 0 12px 30px var(--toolbar-shadow); border: 1px solid var(--toolbar-border);
    }

    button {
        background: var(--button-bg); border: none; box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        width: 56px; height: 56px; border-radius: 50%; color: var(--button-fore); font-size: 24px;
        display: flex; align-items: center; justify-content: center; cursor: pointer; outline: none;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease, box-shadow 0.3s ease;
        -webkit-tap-highlight-color: transparent;
    }

    button:hover {
        transform: scale(1.05) !important;
        box-shadow: 0 10px 28px rgba(0,0,0,0.12) !important;
    }

    button:focus {
        transform: scale(0.95) !important;
        transition: transform 0.1s ease !important;
    }

    button:active {
        transform: scale(0.95) !important;
        transition: transform 0.1s ease !important;
    }
    
    @media (hover: hover) { button:hover { transform: scale(1.15); } }
    button:active { transform: scale(0.95); transition: transform 0.1s ease; }

    #modeBtn.active { background: var(--button-active-bg); color: var(--button-fore); }

    @media (max-width:420px){ 
        .toolbar { left: 12px; top: 12px; padding: 10px; gap: 12px; }
        button { width:48px; height:48px; }
    }
  </style>
</head>
<body oncontextmenu="return false;">

<div class="toolbar">
    <button id="clearBtn"><i class='bx bx-trash'></i></button>
    <button id="modeBtn"><i class='bx bx-pencil'></i></button>
    <button id="themeBtn"><i class='bx bx-moon'></i></button>
</div>

<canvas id="board"></canvas>

<script>
(function () {
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const clearBtn = document.getElementById('clearBtn');
    const modeBtn = document.getElementById('modeBtn');
    const themeBtn = document.getElementById('themeBtn');

    let isEraserMode = false, isPenOnly = false, drawing = false;
    let strokes = [], currentStroke = null;
    
    let tapCount = 0;
    let tapTimer = null;

    const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
    function applyTheme(isDark) {
        if (isDark) { document.documentElement.setAttribute('data-theme', 'dark'); themeBtn.innerHTML = "<i class='bx bx-sun'></i>"; }
        else { document.documentElement.removeAttribute('data-theme'); themeBtn.innerHTML = "<i class='bx bx-moon'></i>"; }
        setTimeout(redrawAll, 50);
    }
    applyTheme(darkQuery.matches);
    darkQuery.addEventListener('change', e => applyTheme(e.matches));

    function updateButtonState() {
        clearBtn.innerHTML = isEraserMode ? "<i class='bx bx-eraser'></i>" : "<i class='bx bx-trash'></i>";
    }

    // ダブルタップとシングルクリックの完全なルール化
    clearBtn.addEventListener('click', () => {
        tapCount++;
        if (tapCount === 1) {
            tapTimer = setTimeout(() => {
                // シングルクリック：今のモードを実行
                if (!isEraserMode) {
                    clearCanvas(); // ゴミ箱モードなら全消去
                }
                // 消しゴムモード中のシングルクリックは何もしない（誤爆防止）
                
                tapCount = 0;
            }, 150); // 判定を少し早めてレスポンス向上
        } else if (tapCount === 2) {
            // ダブルタップ：常にモードを反転
            clearTimeout(tapTimer);
            isEraserMode = !isEraserMode;
            updateButtonState();
            tapCount = 0;
            if (navigator.vibrate) navigator.vibrate(10);
        }
    });

    function clearCanvas() { strokes = []; ctx.clearRect(0, 0, canvas.width, canvas.height); }

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        return { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas.height / rect.height) };
    }

    canvas.addEventListener('pointerdown', (e) => {
        if (isPenOnly && e.pointerType !== 'pen') return;
        drawing = true;
        currentStroke = { points: [getPos(e)], isEraser: isEraserMode };
    });

    canvas.addEventListener('pointermove', (e) => {
        if (!drawing) return;
        const p = getPos(e), pressure = e.pressure || 0.5, dpr = window.devicePixelRatio || 1;
        const last = currentStroke.points[currentStroke.points.length - 1];
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.globalCompositeOperation = isEraserMode ? 'destination-out' : 'source-over';
        ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--stroke').trim();
        ctx.beginPath();
        ctx.lineWidth = (isEraserMode ? 40 : 2.5) * dpr * (0.6 + 0.8 * pressure);
        ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
        currentStroke.points.push({ ...p, p: pressure });
    });

    canvas.addEventListener('pointerup', () => { if (drawing && currentStroke) strokes.push(currentStroke); drawing = false; });

    function redrawAll() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const dpr = window.devicePixelRatio || 1, color = getComputedStyle(document.documentElement).getPropertyValue('--stroke').trim();
        strokes.forEach(s => {
            ctx.globalCompositeOperation = s.isEraser ? 'destination-out' : 'source-over';
            ctx.strokeStyle = color;
            for (let i = 1; i < s.points.length; i++) {
                const prev = s.points[i-1], curr = s.points[i];
                ctx.beginPath();
                ctx.lineWidth = (s.isEraser ? 40 : 2.5) * dpr * (0.6 + 0.8 * curr.p);
                ctx.moveTo(prev.x, prev.y); ctx.lineTo(curr.x, curr.y); ctx.stroke();
            }
        });
    }

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr; canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px'; canvas.style.height = window.innerHeight + 'px';
        redrawAll();
    }
    window.addEventListener('resize', resize); resize();

    themeBtn.addEventListener('click', () => applyTheme(document.documentElement.getAttribute('data-theme') !== 'dark'));
    modeBtn.addEventListener('click', () => { isPenOnly = !isPenOnly; modeBtn.classList.toggle('active', isPenOnly); });
})();
</script>
</body>
</html>
